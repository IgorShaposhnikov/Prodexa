name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/Prodexa.slnx

      - name: Build
        run: dotnet build src/Prodexa.slnx --configuration Release --no-restore

      - name: Verify EF Core migrations
        run: |
          dotnet tool restore
          dotnet tool run dotnet-ef migrations has-pending-model-changes --project src/Prodexa.Persistence --startup-project src/Prodexa.Persistence --configuration Release --no-build

      - name: Unit tests
        run: dotnet test src/tests/Prodexa.Tests/Prodexa.Tests.csproj --configuration Release --no-build

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: prodexa
          POSTGRES_PASSWORD: prodexa
          POSTGRES_DB: prodexa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prodexa -d prodexa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PRODEXA_TEST_CONNECTION_STRING: Host=localhost;Port=5432;Database=prodexa_test;Username=prodexa;Password=prodexa

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/Prodexa.slnx

      - name: Integration tests
        run: dotnet test src/tests/Prodexa.IntegrationTests/Prodexa.IntegrationTests.csproj --configuration Release --no-restore

  aspire-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/Prodexa.slnx

      - name: Build
        run: dotnet build src/Prodexa.slnx --configuration Release --no-restore

      - name: Launch Aspire and verify all three analytics scenarios
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project src/Prodexa.AppHost/Prodexa.AppHost.csproj > /tmp/prodexa-apphost.log 2>&1 &
          apphost_pid=$!
          trap 'kill "$apphost_pid" 2>/dev/null || true' EXIT

          ready=false
          for attempt in $(seq 1 90); do
            if curl --silent --show-error --fail --max-time 2 'http://localhost:5080/api/production/tasks?limit=1' > /dev/null 2>&1; then
              ready=true
              break
            fi

            if ! kill -0 "$apphost_pid" 2>/dev/null; then
              break
            fi

            sleep 2
          done

          if [ "$ready" != "true" ]; then
            cat /tmp/prodexa-apphost.log
            echo 'Aspire API did not become ready.'
            exit 1
          fi

          python3 scripts/demo.py --url http://localhost:5080

  sdk-11-compatibility:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install isolated .NET 11 SDK
        shell: bash
        run: |
          curl --fail --silent --show-error --location https://dot.net/v1/dotnet-install.sh --output "$RUNNER_TEMP/dotnet-install.sh"
          bash "$RUNNER_TEMP/dotnet-install.sh" --channel 11.0 --install-dir "$RUNNER_TEMP/dotnet11" --no-path
          echo "$RUNNER_TEMP/dotnet11" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$RUNNER_TEMP/dotnet11" >> "$GITHUB_ENV"

      - name: Verify SDK selection
        shell: bash
        run: |
          dotnet --list-sdks
          selected="$(dotnet --version)"
          echo "Selected SDK: $selected"
          [[ "$selected" == 11.* ]]

      - name: Restore
        run: dotnet restore src/Prodexa.slnx

      - name: Build .NET 10 projects using .NET 11 SDK
        run: dotnet build src/Prodexa.slnx --configuration Release --no-restore

  browser-csv:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check browser module syntax and CSV sampling
        run: |
          node --input-type=module --check < src/Prodexa.API/wwwroot/import.js
          node --test scripts/csv-sample.test.mjs
